name: NASM compile check

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build NASM 2.07 (book's original toolchain)
        run: |
          curl -sSfLO https://www.nasm.us/pub/nasm/releasebuilds/2.07/nasm-2.07.tar.gz
          tar xzf nasm-2.07.tar.gz
          cd nasm-2.07
          CFLAGS="-Wno-error" ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          nasm -v

      - name: Compile every asm source with nasm -f bin
        run: |
          mkdir -p build
          failed=0
          while IFS= read -r -d '' f; do
            d=$(dirname "$f")
            o="build/${f#booktool/}.bin"
            o=${o//\//_}
            if (cd "$d" && nasm -f bin "$(basename "$f")" -o "/tmp/$(basename "$o")"); then
              echo "OK   $f"
            else
              echo "::error::NASM compile failed: $f"
              failed=1
            fi
          done < <(find booktool -name '*.asm' -print0)
          exit $failed
